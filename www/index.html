<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NCM 解密器 Pro</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
    color: #eee; min-height: 100vh; padding: 16px;
  }
  .wrap { max-width: 480px; margin: 0 auto; }
  h1 { font-size: 20px; text-align: center; margin: 12px 0 4px; color: #00d4ff; }
  .sub { text-align: center; font-size: 12px; color: #888; margin-bottom: 20px; }
  .card {
    background: rgba(255,255,255,0.06); border-radius: 12px;
    padding: 16px; margin-bottom: 14px; border: 1px solid rgba(255,255,255,0.08);
  }
  .step { font-size: 11px; color: #00d4ff; font-weight: 600; margin-bottom: 8px; }
  button {
    width: 100%; padding: 13px; border: none; border-radius: 9px;
    font-size: 15px; font-weight: 600; cursor: pointer;
    background: #00d4ff; color: #001; margin-top: 8px;
    transition: opacity .2s;
  }
  button:active { opacity: .7; }
  button.sec { background: rgba(255,255,255,0.12); color: #eee; }
  pre {
    background: rgba(0,0,0,0.3); border-radius: 8px; padding: 10px;
    font-size: 12px; white-space: pre-wrap; word-break: break-all;
    min-height: 40px; max-height: 140px; overflow-y: auto; color: #aaa;
  }
  label { font-size: 12px; color: #bbb; display: block; margin: 10px 0 4px; }
  select, input[type=text] {
    width: 100%; padding: 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.15);
    background: rgba(0,0,0,0.3); color: #eee; font-size: 14px;
  }
  #log {
    font-size: 11px; color: #6f6; max-height: 160px; overflow-y: auto;
    background: rgba(0,0,0,0.4); border-radius: 8px; padding: 10px; margin-top: 14px;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>🎵 NCM 解密器 Pro</h1>
  <div class="sub">一键将 .ncm 转换为 MP3 / FLAC</div>

  <!-- 步骤 1：选择文件 -->
  <div class="card">
    <div class="step">① 选择文件</div>
    <button id="btnPick">选择 NCM 文件</button>
    <pre id="fileList">尚未选择文件</pre>
  </div>

  <!-- 步骤 2：选择保存位置 -->
  <div class="card">
    <div class="step">② 选择保存文件夹</div>
    <button id="btnFolder" class="sec">选择保存位置</button>
    <pre id="folderInfo">尚未选择文件夹</pre>
  </div>

  <!-- 步骤 3：输出设置 + 转换 -->
  <div class="card">
    <div class="step">③ 输出设置 & 转换</div>
    <label>输出格式</label>
    <select id="format">
      <option value="auto">自动检测</option>
      <option value="mp3">MP3</option>
      <option value="flac">FLAC</option>
    </select>
    <label>文件名模板（只需填名字，扩展名自动加）</label>
    <input type="text" id="tpl" value="{artist} - {title}" placeholder="{artist} - {title}">
    <button id="btnConvert">开始转换</button>
  </div>

  <!-- 日志 -->
  <div id="log"></div>
</div>

<script src="aes-js.min.js"></script>
<script src="app.js"></script>
</body>
</html>
