<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NCM 解密器 Pro</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    color: #eee; min-height: 100vh; padding: 16px;
  }
  .container { max-width: 560px; margin: 0 auto; }
  h1 { text-align: center; font-size: 22px; margin: 12px 0 4px; }
  .subtitle { text-align: center; font-size: 13px; color: #9aa; margin-bottom: 24px; }

  .card {
    background: rgba(255,255,255,0.08);
    border-radius: 14px; padding: 18px; margin-bottom: 16px;
    backdrop-filter: blur(10px);
  }
  .step { font-size: 12px; color: #7cf; font-weight: 600; margin-bottom: 8px; letter-spacing: 1px; }

  .btn {
    display: block; width: 100%; padding: 14px; border: none; border-radius: 10px;
    font-size: 16px; font-weight: 600; cursor: pointer; transition: all .2s;
  }
  .btn-primary { background: #4e8cff; color: #fff; }
  .btn-primary:active { background: #3a6fd6; }
  .btn-secondary { background: rgba(255,255,255,0.12); color: #eee; }
  .btn-secondary:active { background: rgba(255,255,255,0.2); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }

  .path-display {
    margin-top: 10px; padding: 10px; background: rgba(0,0,0,0.3);
    border-radius: 8px; font-size: 13px; color: #bcd; word-break: break-all;
    min-height: 40px; display: flex; align-items: center;
  }
  .path-display.empty { color: #667; font-style: italic; }

  label { font-size: 13px; color: #bcd; display: block; margin-bottom: 6px; }
  select, input[type=text] {
    width: 100%; padding: 11px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2);
    background: rgba(0,0,0,0.3); color: #eee; font-size: 14px; margin-bottom: 4px;
  }
  .hint { font-size: 11px; color: #789; margin-top: 4px; }

  #log {
    max-height: 220px; overflow-y: auto; font-size: 12px; line-height: 1.6;
    font-family: monospace; white-space: pre-wrap; color: #9f9;
  }
  .status { text-align: center; font-size: 14px; margin: 12px 0; min-height: 20px; }
  .status.error { color: #f88; }
  .status.success { color: #8f8; }
</style>
</head>
<body>
<div class="container">
  <h1>🎵 NCM 解密器 Pro</h1>
  <p class="subtitle">将网易云音乐 .ncm 文件转换为 MP3 / FLAC</p>

  <!-- 第1步：选择文件 -->
  <div class="card">
    <div class="step">第 1 步 · 选择文件</div>
    <button class="btn btn-primary" id="btnPickFiles">📂 选择 NCM 文件</button>
    <div class="path-display empty" id="filesDisplay">尚未选择文件</div>
  </div>

  <!-- 第2步：选择保存文件夹 -->
  <div class="card">
    <div class="step">第 2 步 · 选择保存位置</div>
    <button class="btn btn-secondary" id="btnPickFolder">📁 选择保存文件夹</button>
    <div class="path-display empty" id="folderDisplay">尚未选择文件夹</div>
  </div>

  <!-- 第3步：输出设置 -->
  <div class="card">
    <div class="step">第 3 步 · 输出设置</div>
    <label>输出格式</label>
    <select id="formatSelect">
      <option value="auto">自动（根据源文件）</option>
      <option value="mp3">MP3</option>
      <option value="flac">FLAC</option>
    </select>
    <label style="margin-top:12px;">文件名模板</label>
    <input type="text" id="nameTemplate" value="{artist} - {title}" placeholder="{artist} - {title}">
    <div class="hint">可用变量：{title} {artist} {album}。扩展名根据输出格式自动追加。</div>
  </div>

  <!-- 第4步：转换 -->
  <div class="card">
    <button class="btn btn-primary" id="btnConvert" disabled>🚀 开始转换</button>
    <div class="status" id="status"></div>
    <div id="log"></div>
  </div>
</div>

<script src="aes-js.min.js"></script>
<script src="app.js"></script>
</body>
</html>
