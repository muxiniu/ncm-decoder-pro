<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>NCM 解密器 Pro</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    color: #eee;
    min-height: 100vh;
    padding: 16px;
}
.container { max-width: 480px; margin: 0 auto; padding-top: 40px; }
h1 { text-align: center; font-size: 24px; margin-bottom: 8px; color: #e94560; }
.subtitle { text-align: center; font-size: 13px; color: #aaa; margin-bottom: 32px; }
.card {
    background: rgba(255,255,255,0.08);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 16px;
    border: 1px solid rgba(255,255,255,0.1);
}
.step { font-size: 12px; color: #e94560; font-weight: bold; margin-bottom: 8px; }
.btn {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
}
.btn-primary { background: #e94560; color: #fff; }
.btn-primary:active { transform: scale(0.98); }
.btn-primary:disabled { background: #555; color: #999; cursor: not-allowed; }
.btn-secondary { background: rgba(255,255,255,0.1); color: #eee; }
.status {
    margin-top: 12px;
    font-size: 13px;
    color: #aaa;
    word-break: break-all;
    line-height: 1.6;
}
.log {
    max-height: 200px;
    overflow-y: auto;
    font-family: monospace;
    font-size: 12px;
    background: rgba(0,0,0,0.3);
    padding: 10px;
    border-radius: 8px;
    margin-top: 12px;
    white-space: pre-wrap;
}
.log .ok { color: #4ecca3; }
.log .err { color: #e94560; }
.file-list { font-size: 13px; color: #ccc; }
.file-list div { padding: 4px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
</style>
</head>
<body>
<div class="container">
    <h1>🎵 NCM 解密器 Pro</h1>
    <p class="subtitle">将网易云音乐 .ncm 文件转换为标准音频</p>

    <div class="card">
        <div class="step">第 1 步</div>
        <button class="btn btn-primary" id="btnFiles" onclick="pickFiles()">选择 NCM 文件</button>
        <div class="status" id="filesStatus">未选择</div>
        <div class="file-list" id="fileList"></div>
    </div>

    <div class="card">
        <div class="step">第 2 步</div>
        <button class="btn btn-secondary" id="btnFolder" onclick="pickFolder()">选择保存位置</button>
        <div class="status" id="folderStatus">未选择</div>
    </div>

    <div class="card">
        <div class="step">第 3 步</div>
        <button class="btn btn-primary" id="btnConvert" onclick="startConvert()" disabled>
            开始转换
        </button>
        <div class="log" id="log"></div>
    </div>
</div>

<script src="aes-js.min.js"></script>
<script src="app.js"></script>
</body>
</html>
