name: Build NCM Decoder Pro APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Debug & Grant Permission
        run: |
          pwd
          ls -la
          ls -la android/ || echo "android dir not found"
          ls -la android/gradlew || echo "gradlew not found"
          chmod +x android/gradlew || echo "chmod failed"
          
      - name: Build Debug APK
        working-directory: android
        run: bash gradlew :app:assembleDebug --no-daemon
        
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NCM-Decoder-Pro
          path: android/app/build/outputs/apk/debug/*.apk
