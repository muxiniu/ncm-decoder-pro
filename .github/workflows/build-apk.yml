name: Build NCM Decoder Pro APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses
        run: yes | sdkmanager --sdk_root=$ANDROID_HOME --licenses || true

      - name: Prepare assets
        run: |
          mkdir -p android/app/src/main/assets
          cp www/index.html android/app/src/main/assets/
          cp www/app.js android/app/src/main/assets/
          cp www/aes-js.min.js android/app/src/main/assets/ 2>/dev/null || true
          ls -la android/app/src/main/assets/

      - name: Setup Gradle (no wrapper cache)
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.4
          build-root-directory: android

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon
        working-directory: android

      - name: Rename APK
        run: |
          mv android/app/build/outputs/apk/debug/app-debug.apk \
             android/app/build/outputs/apk/debug/NCM-Decoder-Pro.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NCM-Decoder-Pro
          path: android/app/build/outputs/apk/debug/NCM-Decoder-Pro.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0-pro
          name: NCM Decoder Pro v2.0
          files: android/app/build/outputs/apk/debug/NCM-Decoder-Pro.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
