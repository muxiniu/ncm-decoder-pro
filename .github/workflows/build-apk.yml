name: Build NCM Decoder Pro APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android   # 统一以 android/ 为 gradle root

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 33
          build-tools: "33.0.2"

      - name: Accept SDK licenses
        run: yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses || true

      - name: Install Gradle 8.4 manually
        run: |
          export GRADLE_HOME=/opt/gradle-8.4
          if [ ! -x "$GRADLE_HOME/bin/gradle" ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq unzip
            curl -sL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.4-bin.zip
            sudo unzip -q /tmp/gradle.zip -d /opt/
          fi
          echo "$GRADLE_HOME/bin" >> $GITHUB_PATH
          gradle --version

      - name: Ensure gradle wrapper jar exists
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "wrapper jar missing -> generating..."
            gradle wrapper --gradle-version 8.4
          fi
          ls -la gradle/wrapper/
          ls -la gradlew 2>/dev/null || echo "no gradlew file"

      - name: Verify project structure
        run: |
          pwd
          ls -la
          echo "== app module =="
          ls -la app/
          echo "== www (assets source) =="
          ls -la ../www/

      - name: Build Debug APK (full log to console)
        # 用 gradlew（已生成wrapper），--info 打印完整错误
        run: ./gradlew assembleDebug --no-daemon --stacktrace --info 2>&1 | tee /tmp/build.log

      - name: On failure -> upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build.log

      - name: Find & Rename APK (show real error, no masking)
        if: success()
        # 统一在 android/ 下工作，APK 位于 app/build/outputs/apk/debug/
        run: |
          echo "== listing build outputs =="
          ls -la app/build/outputs/apk/debug/ || true
          APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          echo "Found APK: $APK"
          mv "$APK" "app/build/outputs/apk/debug/NCM-Decoder-Pro.apk"
          ls -la app/build/outputs/apk/debug/NCM-Decoder-Pro.apk

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NCM-Decoder-Pro
          # upload-artifact 相对于 github.workspace (仓库根) 解析
          path: android/app/build/outputs/apk/debug/NCM-Decoder-Pro.apk

      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0-pro
          name: "NCM Decoder Pro v2.0"
          # release action 也相对于 github.workspace
          files: android/app/build/outputs/apk/debug/NCM-Decoder-Pro.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
