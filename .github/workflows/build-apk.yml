name: Build NCM Decoder Pro APK

on:
  push:
    branches: [main]
  workflow_dispatch:

# 需要 write 权限创建 release
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android   # gradle root = android/

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 33
          build-tools: "33.0.2"

      - name: Accept SDK licenses
        run: yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses || true

      - name: Verify project structure
        run: |
          echo "== gradle root (android/) =="
          ls -la
          echo "== app module =="
          ls -la app/
          echo "== wrapper =="
          ls -la gradle/wrapper/ || echo "no wrapper dir"
          echo "== www (assets source) =="
          ls -la ../www/

      - name: Build Debug APK
        # gradle-build-action 自动下载 Gradle 8.4 + 生成 wrapper
        uses: gradle/gradle-build-action@v3
        with:
          build-root-directory: android
          gradle-version: 8.4
          arguments: assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        if: success()
        run: |
          mv app/build/outputs/apk/debug/app-debug.apk \
             app/build/outputs/apk/debug/NCM-Decoder-Pro.apk 2>/dev/null || true
          ls -la app/build/outputs/apk/debug/

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NCM-Decoder-Pro
          path: android/app/build/outputs/apk/debug/NCM-Decoder-Pro.apk

      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0-pro
          name: "NCM Decoder Pro v2.0"
          files: android/app/build/outputs/apk/debug/NCM-Decoder-Pro.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
