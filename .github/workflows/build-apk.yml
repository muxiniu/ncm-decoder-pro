name: Build NCM Decoder Pro APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with: { java-version: "17", distribution: "temurin" }
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with: { api-level: 33, build-tools: "33.0.2" }
      - name: Prepare assets
        working-directory: android
        run: |
          mkdir -p app/src/main/assets
          cp ../www/index.html ../www/app.js ../www/aes-js.min.js app/src/main/assets/ 2>/dev/null || true
      - name: Build Debug APK
        working-directory: android
        run: |
          if [ ! -f gradlew ]; then gradle wrapper --gradle-version 8.4 || true; fi
          chmod +x gradlew || true
          ./gradlew assembleDebug --no-daemon || gradle assembleDebug --no-daemon
      - name: Rename APK
        run: mv android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/NCM-Decoder-Pro.apk 2>/dev/null || true
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with: { name: NCM-Decoder-Pro, path: android/app/build/outputs/apk/debug/NCM-Decoder-Pro.apk }
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with: { tag_name: v2.0-pro, name: "NCM Decoder Pro v2.0", files: android/app/build/outputs/apk/debug/NCM-Decoder-Pro.apk }
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
