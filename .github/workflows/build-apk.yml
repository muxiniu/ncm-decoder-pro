name: Build NCM Decoder Pro APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 33
          build-tools: "33.0.2"

      - name: Accept SDK licenses
        run: yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses || true

      - name: Install Gradle 8.4 manually
        run: |
          # 手动下载并安装 gradle 8.4，避免 gradle-build-action 的 wrapper 自动生成问题
          export GRADLE_HOME=/opt/gradle-8.4
          if [ ! -x "$GRADLE_HOME/bin/gradle" ]; then
            curl -sL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.4-bin.zip
            sudo unzip -q /tmp/gradle.zip -d /opt/
          fi
          echo "$GRADLE_HOME/bin" >> $GITHUB_PATH
          gradle --version

      - name: Ensure gradle wrapper jar exists
        working-directory: android
        run: |
          # 如果没有 gradle-wrapper.jar，用安装的 gradle 生成
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "wrapper jar missing -> generating..."
            gradle wrapper --gradle-version 8.4
          fi
          ls -la gradle/wrapper/

      - name: Verify project structure
        working-directory: android
        run: |
          echo "== gradle root (android/) =="
          pwd
          ls -la
          echo "== app module =="
          ls -la app/
          echo "== www (assets source) =="
          ls -la ../www/

      - name: Build Debug APK (full log to console)
        working-directory: android
        # 关键：--info 把错误原因打印到控制台日志，无需下载日志文件
        run: ./gradlew assembleDebug --no-daemon --stacktrace --info 2>&1 | tee /tmp/build.log

      - name: On failure -> upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build.log

      - name: Rename APK
        if: success()
        run: |
          mv android/app/build/outputs/apk/debug/app-debug.apk \
             android/app/build/outputs/apk/debug/NCM-Decoder-Pro.apk 2>/dev/null || true
          ls -la android/app/build/outputs/apk/debug/

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NCM-Decoder-Pro
          path: android/app/build/outputs/apk/debug/NCM-Decoder-Pro.apk

      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0-pro
          name: "NCM Decoder Pro v2.0"
          files: android/app/build/outputs/apk/debug/NCM-Decoder-Pro.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
