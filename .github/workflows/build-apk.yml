name: Build NCM Decoder Pro APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '11076708'

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Verify project structure
        working-directory: android
        run: |
          echo "=== android dir ==="
          ls -la
          echo "=== app/src/main ==="
          ls -la app/src/main
          echo "=== app/src/main/res ==="
          ls -R app/src/main/res
          echo "=== gradle wrapper ==="
          ls -la gradle/wrapper
          echo "=== gradlew version ==="
          ./gradlew --version || true

      - name: Build Debug APK
        id: build
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon --console=plain --info 2>&1 | tee /tmp/build.log
        continue-on-error: true

      - name: Upload build log on failure
        if: steps.build.outcome != 'success'
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build.log

      - name: Upload APK
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: NCM-Decoder-Pro
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Publish APK to release (github-script)
        if: steps.build.outcome == 'success'
        uses: actions/github-script@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const apkDir = 'android/app/build/outputs/apk/debug';
            const files = fs.readdirSync(apkDir).filter(f => f.endsWith('.apk'));
            if (!files.length) throw new Error('no APK found in ' + apkDir);
            const apkPath = path.join(apkDir, files[0]);
            const apkData = fs.readFileSync(apkPath);
            const { owner, repo } = context.repo;
            const tag = 'v2.0-pro';
            let release;
            try {
              release = await github.rest.repos.getReleaseByTagName({ owner, repo, tag });
            } catch(e) {
              release = await github.rest.repos.createRelease({
                owner, repo, tag_name: tag, name: 'NCM Decoder Pro v2.0', draft: false
              });
            }
            const release_id = release.data.id;
            const assets = await github.rest.repos.listReleaseAssets({ owner, repo, release_id });
            for (const a of assets.data) {
              if (a.name === 'NCM-Decoder-Pro.apk') {
                await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: a.id });
              }
            }
            await github.rest.repos.uploadReleaseAsset({
              owner, repo, release_id,
              name: 'NCM-Decoder-Pro.apk',
              data: apkData,
            });
            console.log('RELEASE_URL=' + release.data.html_url);
        continue-on-error: true

      - name: Print release step error
        if: failure()
        run: |
          echo "Release step failed. Build & artifact upload were successful."
          echo "APK is available in the 'NCM-Decoder-Pro' artifact of this run."
          echo "Download from: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
