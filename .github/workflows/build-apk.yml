name: Build NCM Decoder Pro APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses & install packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2" || true

      - name: Prepare assets
        working-directory: android
        run: |
          mkdir -p app/src/main/assets
          cp -r ../www/* app/src/main/assets/
          ls -la app/src/main/assets/

      - name: Build Debug APK with Gradle
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.4
          build-root-directory: android
          arguments: assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        working-directory: android
        run: |
          APK=$(find app/build/outputs/apk -name "*.apk" | head -1)
          cp "$APK" ../NCM-Decoder-Pro.apk
          ls -la ../NCM-Decoder-Pro.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NCM-Decoder-Pro
          path: NCM-Decoder-Pro.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0-pro
          name: NCM 解密器 Pro v2.0
          files: NCM-Decoder-Pro.apk
          body: |
            ## NCM 解密器 Pro —— 全新版本

            - 📦 应用名：**NCM 解密器 Pro**
            - 📦 包名：`com.ncmdecoder.pro`
            - 📦 APK：`NCM-Decoder-Pro.apk`
            - 📦 Release：`v2.0-pro`

            ### 使用
            1. 下载 `NCM-Decoder-Pro.apk` 安装
            2. 打开 App → 选择 NCM 文件 → 选择保存文件夹 → 转换
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
