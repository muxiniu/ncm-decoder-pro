name: Build NCM Decoder Pro APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Copy www assets to assets/www
        run: |
          mkdir -p android/app/src/main/assets/www
          cp www/index.html android/app/src/main/assets/www/
          cp www/app.js     android/app/src/main/assets/www/
          cp www/aes-js.min.js android/app/src/main/assets/www/
          ls -la android/app/src/main/assets/www

      - name: Grant execute permission to gradlew
        working-directory: android
        run: chmod +x gradlew

      - name: Build Debug APK with gradlew
        working-directory: android
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NCM-Decoder-Pro
          path: android/app/build/outputs/apk/debug/*.apk
