name: Build NCM Decoder Pro APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        
      - name: Debug Directory & Permission
        run: |
          echo "=== Current Dir ==="
          pwd
          echo "=== Root Files ==="
          ls -la
          echo "=== Android Dir (if exists) ==="
          ls -la android/ || echo "NO android dir"
          echo "=== Gradlew Check ==="
          if [ -f "android/gradlew" ]; then
            chmod +x android/gradlew
            GRADLEW="android/gradlew"
          elif [ -f "gradlew" ]; then
            chmod +x gradlew
            GRADLEW="./gradlew"
          else
            echo "ERROR: gradlew not found!" && exit 1
          fi
          echo "Using: $GRADLEW"
          
      - name: Build Debug APK
        run: |
          if [ -z "$GRADLEW" ]; then echo "GRADLEW not set"; exit 1; fi
          $GRADLEW :app:assembleDebug --no-daemon --stacktrace
        
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NCM-Decoder-Pro
          path: |
            android/app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/*.apk
