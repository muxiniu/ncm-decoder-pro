name: Build NCM Decoder Pro APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools: 34.0.0
          
      - name: Debug & Build APK (One Step)
        run: |
          echo "=== 1. Directory Check ==="
          pwd
          ls -la
          
          # 自动寻找 gradlew（支持根目录或 android 子目录）
          GRADLEW=""
          if [ -f "android/gradlew" ]; then
            GRADLEW="android/gradlew"
          elif [ -f "gradlew" ]; then
            GRADLEW="./gradlew"
          else
            echo "❌ ERROR: gradlew not found in root or android/!"
            ls -R
            exit 1
          fi
          
          echo "✅ Found gradlew at: $GRADLEW"
          chmod +x $GRADLEW
          
          echo "=== 2. Android Env ==="
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          
          echo "=== 3. Building Debug APK ==="
          # 尝试带 :app 模块编译，若失败则退而求其次直接编译
          $GRADLEW :app:assembleDebug --no-daemon --stacktrace || $GRADLEW assembleDebug --no-daemon --stacktrace
        
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NCM-Decoder-Pro
          path: |
            android/app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/*.apk
            build/outputs/apk/debug/*.apk
