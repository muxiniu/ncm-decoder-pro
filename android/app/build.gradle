apply plugin: 'com.android.application'

android {
    compileSdkVersion 33

    defaultConfig {
        applicationId "com.ncmdecoder.pro"
        minSdkVersion 21
        targetSdkVersion 33
        versionCode 2
        versionName "2.0"
    }

    buildTypes {
        release { minifyEnabled false }
    }

    // 前端在仓库根的 www/，gradle 在 android/app/build.gradle，
    // 故相对路径为 ../../www -> 复制到 app/src/main/assets/
    task copyAssets(type: Copy) {
        from '../../www'
        into 'src/main/assets'
        include '**/*'
    }
    preBuild.dependsOn copyAssets
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
